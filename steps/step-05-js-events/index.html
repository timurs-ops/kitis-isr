<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шаг 5 · Дни, избранное, таймер</title>
<link rel="stylesheet" href="style.css">
<script src="../../data/schedule.js"></script>
</head>
<body>
<main>
<h1>Расписание ИСр24-1</h1>

<div class="toolbar">
  <div class="days">
    <button class="day-btn" data-day="0">Пн</button>
    <button class="day-btn" data-day="1">Вт</button>
    <button class="day-btn" data-day="2">Ср</button>
    <button class="day-btn" data-day="3">Чт</button>
    <button class="day-btn" data-day="4">Пт</button>
    <button class="day-btn" data-day="5">Сб</button>
    <button class="day-btn" data-day="6">Вс</button>
  </div>
  <button id="fav-btn" aria-pressed="false">☆ В избранное</button>
  <span id="timer"></span>
</div>

<div id="app"></div>
</main>
<script src="script.js"></script>
</body>
</html>
